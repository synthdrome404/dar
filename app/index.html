<style>
:root{
  --cream:#F7F3E9;--green:#203E2B;--green2:#2C5239;--greenS:#DCE4D5;--burg:#6F293E;--burgS:#F2E1E5;
  --beige:#E9E4D6;--beige2:#F0ECE1;--paper:#FCFAF5;--gold:#9F825A;--goldS:#EFE5D3;--goldD:#76603F;
  --ink:#1C281F;--ink2:#435041;--muted:#6C6A5E;--line:rgba(32,62,43,.14);--line2:rgba(32,62,43,.08);
  --serif:'Prata',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:20px;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#F7F3E9}
body{margin:0;background:#F7F3E9;color:var(--ink);font:400 16px/1.5 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;color:var(--green);letter-spacing:.005em}
p{margin:0}
img{max-width:100%}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14.5px} .tiny{font-size:14px;color:var(--muted);line-height:1.45}
.nowrap{white-space:nowrap} .tnum{font-variant-numeric:tabular-nums}
.up{color:#2E7448} .down{color:var(--burg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype bar */
.proto{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:#17301F;color:#D9CFB8;font-size:14px;line-height:1.3}
.proto-l{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.proto-l span{overflow:hidden;text-overflow:ellipsis}
.proto-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.proto-time{opacity:.8}
.proto-role{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:10px;color:#F7F3E9;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.proto-role:hover{background:rgba(247,243,233,.1)}
.proto-role .ic{width:16px;height:16px;color:#D2B888}
@media(max-width:600px){.proto-time{display:none}}
body[data-auth] .proto-role{display:none}

/* shell */
.side{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:56px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(247,243,233,.93);-webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-family:var(--serif);font-size:21px;color:var(--green);line-height:1;white-space:nowrap}
.brand-name span{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--gold)}
.top .sp{flex:1}
.icon-btn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--green);flex:none}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 14px 0 4px;margin-left:-6px;border-radius:12px;font-weight:700;font-size:16px;color:var(--green);white-space:nowrap;flex:none}
.back .ic{width:24px;height:24px;stroke-width:2}
.back:hover{background:var(--beige2)}
.top-t{font-family:var(--serif);font-size:18px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn:hover{background:var(--beige2)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--burg);box-shadow:0 0 0 2px var(--cream)}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--beige);color:var(--green);font-weight:800;font-size:14px;flex:none;letter-spacing:.02em}
.av.g{background:var(--green);color:var(--cream)} .av.b{background:var(--burgS);color:var(--burg)} .av.o{background:var(--goldS);color:var(--goldD)}
.av.sm{width:34px;height:34px;font-size:13px} .av.lg{width:56px;height:56px;font-size:18px}
.top-desk{display:none}
.main{padding:4px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:780px;margin:0 auto;min-width:0}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;background:var(--beige);border-radius:15px;margin:10px 0 2px}
.role{height:44px;border-radius:11px;font-size:15px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.role.on{background:var(--paper);color:var(--green);box-shadow:0 1px 3px rgba(32,62,43,.14)}
.role .ic{width:16px;height:16px}
.l-short{display:none}
@media(max-width:520px){.role .l-full{display:none}.role .l-short{display:inline}.role .ic{display:none}}
.ph{padding:18px 0 16px}
.ph h1{font-size:30px;line-height:1.15}
.ph-s{color:var(--muted);margin-top:6px;font-size:16px;max-width:640px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px max(2px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(2px,env(safe-area-inset-left,0px));background:rgba(247,243,233,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:12.5px;letter-spacing:-.01em;font-weight:700;color:var(--muted);position:relative;border-radius:12px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
.tab.on{color:var(--green)} .tab.on .ic{stroke-width:2.1}
.tab .ic{width:23px;height:23px}
.tab .bdg{position:absolute;top:1px;left:calc(50% + 5px)}
.bdg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--burg);color:#fff;font-size:12px;font-weight:800;line-height:1}

/* cards & layout */
.card{background:var(--beige);border-radius:var(--r);padding:18px;min-width:0;display:block}
.card.paper{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line2)}
.card.dark{background:var(--green);color:#E9E4D6}
.card.dark h2,.card.dark h3{color:#F7F3E9}
.card.wine{background:var(--burg);color:#F6E9EC}
.card.wine h2,.card.wine h3{color:#fff}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;min-width:0}
.ch h3{font-size:20px;line-height:1.25;min-width:0}
.ch .k{font-size:14px;color:var(--muted);white-space:nowrap}
.card.dark .ch .k{color:#BFC9BA}
.stack{display:grid;gap:12px;min-width:0}
.split{display:grid;gap:12px;min-width:0}
.mas{columns:1;column-gap:20px}
.mas>*{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:12px}
.g2{display:grid;gap:12px;min-width:0}
.sec-t{font-family:var(--serif);font-size:21px;color:var(--green);margin:22px 0 12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

/* lists */
.list{display:grid;min-width:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;width:100%;text-align:left}
.list>.li:first-child{border-top:0;padding-top:2px}
.li-b{flex:1;min-width:0;display:block}
.li-t{display:block;font-weight:700;line-height:1.3}
.li-s{display:block;font-size:14.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.li>.ic:last-child{color:var(--muted);width:18px;height:18px}
button.li:hover .li-t{color:var(--green2)}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--paper);color:var(--green);flex:none}
.card.paper .ib{background:var(--beige2)}
.ib.wine{background:var(--burgS);color:var(--burg)} .ib.gold{background:var(--goldS);color:var(--goldD)} .ib.dark{background:var(--green);color:var(--cream)}
.date-b{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--paper);padding:6px 0;line-height:1.1}
.date-b b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;color:var(--green)}
.date-b small{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;background:var(--green);color:#F7F3E9;font-weight:700;font-size:16px;white-space:nowrap;transition:transform .12s,background .2s;max-width:100%}
.btn:hover{background:var(--green2)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--paper);color:var(--green);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sec:hover{background:#fff}
.btn.wine{background:var(--burg)} .btn.wine:hover{background:#5d2134}
.btn.gold{background:var(--gold)}
.btn.light{background:#F7F3E9;color:var(--green)} .btn.light:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--green);box-shadow:inset 0 0 0 1px var(--line)}
.card.dark .btn.ghost{color:#F7F3E9;box-shadow:inset 0 0 0 1px rgba(247,243,233,.35)}
.btn.sm{height:44px;padding:0 16px;border-radius:12px;font-size:15px}
.btn.xs{height:44px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.42;transform:none}
.btn .ic{width:18px;height:18px}
.lnk{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--green);font-weight:700;font-size:15px;white-space:nowrap}
.ch .lnk{margin:-10px 0}
.lnk .ic{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* chips, tags, grades */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;min-width:0}
.card .hs{margin:0 -18px;padding:2px 18px}
.hs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:700;color:var(--ink2);white-space:nowrap;flex:none}
.chip.on{background:var(--green);color:#F7F3E9;box-shadow:none}
.chip:disabled{opacity:.42}
.chip small{font-size:14px;font-weight:600;opacity:.8}
.chip .ic{width:16px;height:16px}
.seg{display:flex;gap:3px;padding:4px;background:var(--beige);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;height:44px;border-radius:11px;font-weight:700;font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.seg button small{font-size:14px}
.seg button.on{background:var(--paper);color:var(--green);box-shadow:0 1px 3px rgba(32,62,43,.14)}
.tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;background:var(--beige2);color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.card:not(.paper) .tag{background:var(--paper)}
.tag.green{background:var(--greenS)!important;color:var(--green)}
.tag.wine{background:var(--burgS)!important;color:var(--burg)}
.tag.gold{background:var(--goldS)!important;color:var(--goldD)}
.tag.dark{background:var(--green)!important;color:#F7F3E9}
.tag .ic{width:15px;height:15px}
.g{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;font-weight:800;font-size:17px;flex:none;font-family:var(--sans);line-height:1}
.g5{background:var(--green);color:#F7F3E9} .g4{background:var(--greenS);color:var(--green)} .g3{background:var(--goldS);color:var(--goldD)} .g2{background:var(--burgS);color:var(--burg)}
.g.sm{width:30px;height:30px;font-size:14.5px;border-radius:9px}
button.g{width:44px;height:44px;font-size:18px;border-radius:12px}
.g.xl{width:64px;height:64px;font-size:30px;border-radius:18px}
.bar{display:block;height:8px;border-radius:99px;background:rgba(32,62,43,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--green);transition:width .4s}
.card.dark .bar{background:rgba(247,243,233,.16)} .card.dark .bar>i{background:#C8AC7E}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--goldS);color:#5B4729;font-size:15px;line-height:1.45}
.note .ic{color:var(--gold);margin-top:1px}
.note.green{background:var(--greenS);color:var(--green)} .note.green .ic{color:var(--green)}
.note.wine{background:var(--burgS);color:var(--burg)} .note.wine .ic{color:var(--burg)}
.quote{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--gold);background:var(--paper);border-radius:0 12px 12px 0;font-size:16px;line-height:1.5}

/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:#D9C49C}
.live i{width:8px;height:8px;border-radius:50%;background:#86D3A0;box-shadow:0 0 0 4px rgba(134,211,160,.2);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(134,211,160,0)}}
.hero-time{font-size:15px;color:#C9D1C2;font-variant-numeric:tabular-nums}
.hero h2{font-size:29px;margin:12px 0 8px;line-height:1.12}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:#D3DACB}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta .ic{width:15px;height:15px;opacity:.8}
.hero-foot{display:flex;justify-content:space-between;gap:6px 12px;font-size:15px;color:#C6CEBF;margin-top:10px;flex-wrap:wrap}

/* timeline */
.tl{display:grid}
.tl-i{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.tl-i:first-child{border-top:0;padding-top:0}
.tl-t{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tl-b{min-width:0}
.tl-b b{display:block;font-weight:700;line-height:1.3}
.tl-b small{display:block;font-size:14.5px;color:var(--muted);line-height:1.35}
.tl-i.past .tl-b b{color:var(--ink2);font-weight:600}
.tl-i.past>.ic{color:var(--gold)}
.tl-i.now{background:var(--paper);margin:2px -10px;padding:10px;border-radius:14px;border-top-color:transparent;box-shadow:inset 0 0 0 1.5px var(--green)}
.tl-i.now+.tl-i{border-top-color:transparent}

/* diary */
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.weeknav .mid{flex:1;text-align:center;line-height:1.25}
.weeknav .mid b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;color:var(--green)}
.weeknav .mid small{font-size:14px;color:var(--muted)}
.rb{width:44px;height:44px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--green);flex:none}
.rb:disabled{opacity:.35}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.dh h3{font-size:20px}
.dl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start;min-width:0}
.dl-n{font-weight:800;color:var(--green);font-size:15px;line-height:1.25}
.dl-n small{display:block;font-weight:600;color:var(--muted);font-size:14px}
.dl-s{font-weight:700;line-height:1.3}
.dl-h{font-size:15px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;line-height:1.4}
.dl-h .ic{width:15px;height:15px;margin-top:2px;color:var(--gold)}
.dl-c{font-size:14.5px;display:block;color:var(--muted);margin-top:8px;padding-left:10px;border-left:2px solid var(--gold);line-height:1.45}
.dl.now{background:var(--paper);margin:0 -10px;padding:12px 10px;border-radius:14px;border-top-color:transparent}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wg{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:14px;background:var(--paper);min-width:0;text-align:left;min-height:56px}
.wg b{display:block;font-size:15px;line-height:1.25}
.wg small{display:block;font-size:14px;color:var(--muted);line-height:1.3}
.wg>span:last-child{min-width:0}

/* kids switch */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kid{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:15px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);min-width:0;text-align:left}
.kid b{display:block;font-size:16px;line-height:1.2}
.kid small{font-size:14px;color:var(--muted)}
.kid.on{background:var(--green);color:#F7F3E9;box-shadow:none}
.kid.on small{color:#C6CFBF}
.kid.on .av{background:#F7F3E9}

/* options */
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:15px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);text-align:left;min-width:0}
.opt.on{box-shadow:inset 0 0 0 2px var(--green)}
.opt:disabled{opacity:.6}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(32,62,43,.28);flex:none;background:var(--paper)}
.opt.on .radio{box-shadow:inset 0 0 0 7px var(--green)}
.check{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(32,62,43,.3);display:grid;place-items:center;flex:none;color:transparent;background:var(--paper);transition:background .15s}
.check.on{background:var(--green);box-shadow:none;color:#F7F3E9}
.check .ic{width:15px;height:15px;stroke-width:2.8}
.opts{display:grid;gap:8px}
.toggle{width:46px;height:28px;border-radius:14px;background:rgba(32,62,43,.2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--green)} .toggle.on::after{transform:translateX(18px)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{height:46px;border-radius:13px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;color:var(--green)}
.slot.on{background:var(--green);color:#F7F3E9;box-shadow:none}
.slot:disabled{background:transparent;color:var(--muted);font-weight:600;opacity:.55;text-decoration:line-through}
@media(min-width:760px){.slots{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* menu */
.dish{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.dish:first-child{border-top:0;padding-top:0}
.dish-b{flex:1;min-width:0}
.dish-n{font-weight:700;line-height:1.35}
.dish-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--burgS);color:var(--burg);font-size:14px;font-weight:700;line-height:1.4}
.warn .ic{width:16px;height:16px;margin-top:1px}
.mealh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.mealh h3{font-size:20px}
.dayt{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;flex:1 0 62px;padding:8px 6px;border-radius:15px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.dayt b{font-size:15px} .dayt small{font-size:14px;color:var(--muted);white-space:nowrap}
.dayt i{width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:2px}
.dayt i.off{background:var(--burg)} .dayt i.lock{background:rgba(32,62,43,.25)}
.dayt.on{background:var(--green);color:#F7F3E9;box-shadow:none} .dayt.on small{color:#C6CFBF} .dayt.on i{background:#C8AC7E}

/* sheet & toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(18,30,22,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sh-grab{width:40px;height:4px;border-radius:2px;background:rgba(32,62,43,.2);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-head h3{font-size:23px;line-height:1.2}
@media(min-width:760px){.ov{align-items:center;padding:24px}.sheet{border-radius:24px;padding:22px 26px 26px}.sh-grab{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(calc(100vw - 32px),420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:15px;background:var(--green);color:#F7F3E9;font-size:15px;font-weight:600;line-height:1.4;box-shadow:0 14px 34px -12px rgba(0,0,0,.45);animation:up .25s}
.toast .ic{color:#D2B888}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 12px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line2);font-size:15px;font-weight:700;line-height:1.25;min-width:0;color:var(--ink)}
.tile .ic{color:var(--green);width:22px;height:22px}
.tile.on{background:var(--green);color:#F7F3E9} .tile.on .ic{color:#D2B888}
.tile .bdg{position:absolute;top:10px;right:10px}

/* forms */
.field{display:grid;gap:7px;margin-bottom:14px;min-width:0}
.lbl{display:block;font-size:15px;font-weight:700;color:var(--ink2);line-height:1.3}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--paper);outline:none;font-size:16px;min-width:0}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(159,130,90,.18)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.55}

/* charts */
.lc{position:relative;padding:8px 0 22px 30px}
.lc-plot{position:relative;height:var(--h,170px)}
.lc-tick{position:absolute;left:0;right:0;border-top:1px dashed rgba(32,62,43,.16)}
.lc-tick span{position:absolute;left:-30px;top:-9px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc-line{fill:none;stroke:var(--green);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.lc-line.b{stroke:var(--gold);stroke-dasharray:5 4}
.lc-area{fill:rgba(32,62,43,.08)}
.lc-dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--green)}
.lc-dot.last{background:var(--green);width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.lc-x{position:absolute;left:30px;right:0;bottom:0;height:18px}
.lc-x span{position:absolute;top:0;transform:translateX(-50%);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lc-x span:first-child{transform:none} .lc-x span.end{transform:translateX(-100%)}
.card.dark .lc-tick{border-color:rgba(247,243,233,.16)} .card.dark .lc-tick span,.card.dark .lc-x span{color:#BFC9BA}
.card.dark .lc-line{stroke:#D2B888} .card.dark .lc-area{fill:rgba(210,184,136,.12)} .card.dark .lc-dot{background:var(--green);box-shadow:0 0 0 2px #D2B888} .card.dark .lc-dot.last{background:#D2B888}
.hb{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;gap:10px;align-items:center;font-size:15px;padding:7px 0;min-width:0}
.hb-l{overflow:hidden;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hb-t{height:10px;border-radius:99px;background:rgba(32,62,43,.09);overflow:hidden;position:relative}
.hb-t i{display:block;height:100%;background:var(--green);border-radius:inherit}
.hb-t i.gold{background:var(--gold)} .hb-t i.wine{background:var(--burg)} .hb-t i.lt{background:#8FA68F}
.hb-v{font-weight:800;font-variant-numeric:tabular-nums;font-size:14.5px;text-align:right;min-width:42px}
.vb{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px}
.vb-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.vb-b{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:var(--green);min-height:3px}
.vb-b.lt{background:#B9C7B4} .vb-b.gold{background:var(--gold)} .vb-b.hatch{background:repeating-linear-gradient(135deg,#C9D3C3 0 6px,#DCE4D5 6px 12px)}
.vb-l{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.vb-v{font-size:14px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.spark{display:block;overflow:visible}

/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--beige);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi.dark{background:var(--green);color:#E9E4D6}
.kpi-l{font-size:14px;line-height:1.3;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi.dark .kpi-l{color:#C6CFBF}
.kpi-l .ic{width:16px;height:16px;color:var(--gold)}
.kpi-v{font-family:var(--serif);font-size:28px;color:var(--green);line-height:1.15;margin-top:4px;white-space:nowrap}
.kpi.dark .kpi-v{color:#F7F3E9}
.kpi-v small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:600}
.kpi-s{font-size:14px;color:var(--ink2);line-height:1.35}
.kpi.dark .kpi-s{color:#D3DACB}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line2);font-size:16px;line-height:1.45;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--green);color:#F7F3E9;border-radius:18px 18px 6px 18px;box-shadow:none}
.msg time{display:block;font-size:13px;opacity:.7;margin-top:4px}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--line)}
.composer .inp{min-height:48px;height:48px;resize:none;padding:11px 14px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--burg);flex:none}

/* shop */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:var(--paper);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--line2);min-width:0}
.prod img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--beige)}
.prod-b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.prod-n{font-weight:800;line-height:1.25}
.prod-d{font-size:14px;color:var(--muted);line-height:1.4;flex:1}
.prod-p{font-family:var(--serif);font-size:19px;color:var(--green)}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.qty button{width:44px;height:44px;display:grid;place-items:center;color:var(--green)}
.qty b{min-width:18px;text-align:center}

/* QR, misc */
.qr{width:200px;height:200px;margin:14px auto;padding:12px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
.qr svg{width:100%;height:100%;display:block}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--greenS);border-top-color:var(--green);animation:rot .8s linear infinite;margin:26px auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:64px;height:64px;border-radius:50%;background:var(--green);color:#F7F3E9;display:grid;place-items:center;margin:16px auto 12px}
.okc .ic{width:32px;height:32px;stroke-width:2.4}
.center{text-align:center}
.d-only{display:none}
.big{font-family:var(--serif);font-size:34px;color:var(--green);line-height:1.1}
.steps{display:grid;gap:0;counter-reset:st}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--green);color:#F7F3E9;display:grid;place-items:center;font-weight:800;font-size:14.5px;flex:none}
.step-n.off{background:transparent;box-shadow:inset 0 0 0 2px rgba(32,62,43,.25);color:var(--muted)}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:14px;white-space:nowrap;vertical-align:1px}
.kbd .ic{width:15px;height:15px}
.phone{width:190px;height:380px;border-radius:36px;background:#18261C;padding:9px;margin:4px auto 0;box-shadow:0 24px 40px -24px rgba(0,0,0,.6)}
.phone-s{height:100%;border-radius:28px;background:linear-gradient(165deg,#E3D8C2 0%,#B9C2A8 60%,#8FA38F 100%);padding:34px 14px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;align-content:start}
.phone-s span{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.5)}
.phone-s .dar{background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(247,243,233,.9),0 6px 14px rgba(0,0,0,.25);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-3px)}}
.phone-cap{text-align:center;font-size:14px;color:var(--muted);margin-top:10px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{display:grid;place-items:center;height:60px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);min-width:0;transition:transform .15s}
.mood:active{transform:scale(.95)}
.mood svg{width:38px;height:38px}
.mood-sc{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--muted)}
.card.dark .mood-sc{color:#BFC9BA}
.mood.on{background:var(--green);color:#F7F3E9;box-shadow:none}
.card.dark .mood{background:rgba(247,243,233,.08);box-shadow:none;color:#E9E4D6}
.card.dark .mood.on{background:#F7F3E9;color:var(--green)}

/* teacher & admin */
.jr{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.jr-n{font-weight:700;line-height:1.25;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att{height:44px;min-width:50px;padding:0 10px;border-radius:12px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.att.p{background:var(--greenS);color:var(--green)} .att.n{background:var(--burgS);color:var(--burg)} .att.l{background:var(--goldS);color:var(--goldD)}
.gcell{width:44px;height:44px;border-radius:12px;border:1.5px dashed rgba(32,62,43,.3);color:var(--muted);display:grid;place-items:center;font-weight:800}
.gpick{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 8px 34px}
.gpick .g{cursor:pointer;width:48px;height:44px}
.st{display:grid;grid-template-columns:40px repeat(4,minmax(0,1fr));gap:4px}
.st-h{font-size:14px;font-weight:800;text-align:center;color:var(--ink2);line-height:1.2;padding-bottom:4px}
.st-h small{display:block;font-weight:600;color:var(--muted);font-size:14px}
.st-t{font-size:14px;color:var(--muted);display:flex;align-items:center;font-variant-numeric:tabular-nums;font-weight:700}
.sc{height:48px;border-radius:11px;font-size:12.5px;font-weight:700;letter-spacing:-.02em;display:grid;place-items:center;text-align:center;line-height:1.15;padding:2px 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sc.closed{border:1.5px dashed rgba(32,62,43,.22);color:var(--muted);font-weight:600}
.sc.open{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--green);color:var(--green)}
.sc.booked{background:var(--green);color:#F7F3E9}
.sc.mine{background:var(--burg);color:#fff}
.fn{display:grid;gap:6px}
.fn-b{height:48px;margin:0 auto;border-radius:12px;background:var(--green);color:#F7F3E9;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;font-weight:700;font-size:15px;min-width:190px;max-width:100%;transition:width .4s}
.fn-b b{font-family:var(--serif);font-weight:400;font-size:20px}
.fn-c{text-align:center;font-size:14px;color:var(--muted);font-weight:700}
.stage{display:flex;gap:3px}
.stage i{flex:1;height:5px;border-radius:3px;background:rgba(32,62,43,.13)}
.stage i.on{background:var(--green)}
.gauge{display:block;width:100%;max-width:240px;margin:0 auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:14px;color:var(--muted);font-weight:800;padding:0 8px 8px 0}
.tbl td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:middle}
.tbl td:last-child,.tbl th:last-child{padding-right:0;text-align:right}
.counter{font-family:var(--serif);font-size:44px;line-height:1;color:#F7F3E9}
.counter small{font-family:var(--sans);font-size:15px;color:#C6CFBF;font-weight:600}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}

/* sign-in */
body[data-auth] .side,body[data-auth] .top,body[data-auth] .tabbar{display:none!important}
body[data-auth] .main{padding-bottom:40px}
.auth-side{display:none}
.auth{max-width:440px;margin:0 auto;padding:24px 0 8px}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.auth-brand .brand-name{font-size:27px}
.auth-brand small{display:block;font-size:14px;color:var(--muted);margin-top:5px}
.auth h1{font-size:32px;line-height:1.15}
.auth-s{color:var(--ink2);margin:8px 0 22px;line-height:1.5}
.otp{letter-spacing:.45em;text-align:center;font-size:28px!important;font-weight:800;font-variant-numeric:tabular-nums;min-height:62px!important;padding-left:calc(14px + .45em)!important}
.auth-err{display:flex;gap:8px;align-items:center;color:var(--burg);font-weight:700;font-size:15px;margin:-4px 0 14px}
.auth-err .ic{width:18px;height:18px}
.auth-hint{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.45}
.auth-or{display:flex;align-items:center;gap:12px;margin:30px 0 14px;color:var(--muted);font-size:14px;font-weight:700}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-role{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);text-align:left;min-height:96px;min-width:0}
.demo-role .ic{width:24px;height:24px;color:var(--gold);margin-bottom:2px}
.demo-role b{font-size:16px;line-height:1.2;color:var(--green)}
.demo-role small{font-size:14px;color:var(--muted);line-height:1.3}
.demo-role:hover{box-shadow:inset 0 0 0 2px var(--green)}
.auth-foot{margin-top:26px;font-size:14px;color:var(--muted);line-height:1.5}
.linkbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--green);font-weight:700;font-size:15px}
.linkbtn .ic{width:18px;height:18px}
.linkbtn:disabled{color:var(--muted);font-weight:600}
.more-row{display:flex;justify-content:flex-start;margin-top:4px}
.hero-link{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;margin-top:14px;padding:0 14px;border-radius:14px;background:rgba(247,243,233,.1);color:#F7F3E9;font-weight:700;font-size:15px}
.hero-link .ic{width:18px;height:18px;color:#D2B888}
.saved-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.saved-row .counter{font-size:34px}

/* desktop */
@media(min-width:1024px){
  .auth-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 44px);margin:0 -40px}
  .auth-side{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:56px 64px;background:var(--green);color:#E6E0D0}
  .auth-side .brand-name{color:#F7F3E9;font-size:34px}
  .auth-side .brand-name span{color:#D2B888;font-size:18px}
  .auth-side h2{color:#F7F3E9;font-size:34px;line-height:1.2;max-width:520px}
  .auth-side .li{border-color:rgba(247,243,233,.14)}
  .auth-side .li-t{color:#F7F3E9} .auth-side .li-s{color:#BFC9BA}
  .auth-side .ib{background:rgba(247,243,233,.1);color:#D2B888}
  .auth{align-self:center;padding:40px 24px;width:100%}
  .auth-brand{display:none}
  .d-only{display:block}
  body[data-auth] .app{display:block;background:var(--cream)}
  body[data-auth] .main{max-width:none;padding:0 40px}
  .app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--green) 276px,var(--cream) 276px)}
  .side{display:block;position:sticky;top:0;height:calc(100vh - 44px);overflow:auto;background:var(--green);color:#E6E0D0;scrollbar-width:thin}
  .side-in{display:flex;flex-direction:column;min-height:100%;padding:24px 18px 20px}
  .side .brand-name{color:#F7F3E9;font-size:25px}
  .side .brand-name span{color:#D2B888}
  .side .brand small{display:block;font-size:14px;color:#B4C0AF;margin-top:5px;font-family:var(--sans);letter-spacing:.02em}
  .side-l{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9FB09B;font-weight:800;margin:26px 10px 10px}
  .side-roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .srole{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-radius:12px;background:rgba(247,243,233,.07);color:#E6E0D0;font-size:14px;font-weight:700;min-width:0;white-space:nowrap}
  .srole .ic{width:16px;height:16px;opacity:.8}
  .srole:hover{background:rgba(247,243,233,.13)}
  .srole.on{background:#F7F3E9;color:var(--green)}
  .snav{display:grid;gap:2px}
  .sn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-size:15.5px;font-weight:500;color:#DCE2D5;text-align:left}
  .sn .ic{opacity:.85}
  .sn:hover{background:rgba(247,243,233,.08)}
  .sn.on{background:rgba(247,243,233,.14);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #D2B888}
  .sn .bdg{margin-left:auto}
  .side-foot{margin-top:auto;padding-top:20px}
  .side-user{display:flex;gap:10px;align-items:center;padding:12px;border-radius:15px;background:rgba(247,243,233,.07);width:100%;text-align:left}
  .side-user b{display:block;font-size:15px;color:#F7F3E9;line-height:1.25}
  .side-user small{font-size:14px;color:#B4C0AF}
  .side-user .av{background:#F7F3E9}
  .side-note{font-size:14px;color:#9FB09B;margin:12px 10px 0;line-height:1.4}
  .tabbar,.top>.brand,.top>.back,.top>.top-t,.top .m-only{display:none}
  .top{height:70px;padding:0 max(40px,env(safe-area-inset-right,0px)) 0 40px;background:rgba(247,243,233,.9)}
  .top-desk{display:flex;align-items:center;gap:14px;width:100%}
  .crumbs{font-size:15px;color:var(--muted);white-space:nowrap}
  .crumbs b{color:var(--ink);font-weight:700}
  .timechip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--beige);font-size:14px;font-weight:700;color:var(--ink2)}
  .timechip .ic{width:16px;height:16px;color:var(--gold)}
  .meb{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;text-align:left}
  .meb:hover{background:var(--beige2)}
  .meb b{font-size:15px;display:block;line-height:1.2}
  .meb small{font-size:14px;color:var(--muted)}
  .main{max-width:1200px;padding:6px max(40px,env(safe-area-inset-right,0px)) 56px 40px;margin:0}
  .ph{padding:22px 0 22px}
  .ph h1{font-size:40px}
  .mas{columns:2 380px}
  .mas.m3{columns:3 320px}
  .mas>*{margin-bottom:20px}
  .stack,.g2{gap:20px}
  .kids{display:inline-grid;grid-template-columns:repeat(2,220px)}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .shop{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .toasts{bottom:28px;left:auto;right:28px;transform:none}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
  .split.rev{grid-template-columns:minmax(0,1fr) 360px}
  .split .wgs{grid-template-columns:1fr}
  .card{padding:22px}
  .card .hs{margin:0 -22px;padding:2px 22px}
  .hs{flex-wrap:wrap;overflow:visible}
}
@media(min-width:1024px) and (max-width:1180px){.mas.m3{columns:2 340px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function lineChart(pts,{min,max,ticks,labels,h=170,fmt=v=>fx(v,1),series2}){

function qrSVG(seed){
  const r=rng(hash(seed)), N=25; let s='';
  const finder=(x,y)=>`<path d="M${x} ${y}h7v7h-7z" fill="none" stroke="#203E2B" stroke-width="1" transform="translate(.5 .5) scale(1)"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#203E2B"/>`;
  const inF=(i,j)=>(i<8&&j<8)||(i>=N-8&&j<8)||(i<8&&j>=N-8);
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ if(inF(i,j)) continue; if(r()<0.47) s+=`M${i} ${j}h1v1h-1z`; }
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges" aria-label="QR-код для оплаты (демо)"><path d="${s}" fill="#203E2B"/><g transform="translate(-.5 -.5)">${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</g><rect x="${N/2-3}" y="${N/2-3}" width="6" height="6" rx="1.4" fill="#fff"/><text x="${N/2}" y="${N/2+1.1}" text-anchor="middle" font-size="2.8" font-family="Georgia,serif" fill="#6F293E">СБП</text></svg>`;
}

/* Sheets live in browser history: Back closes the sheet instead of leaving the screen. */
let sheetHist=false, ignorePop=0, ignoreTimer=null;
function sheet(title,body){
  const L=$('#layer'), was=!!$('#ov');
  L.innerHTML=`<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-grab"></div><div class="sh-head"><h3>${title}</h3><button class="icon-btn" data-a="closeSheet" aria-label="Закрыть">${ic('x')}</button></div><div class="sh-body">${body}</div></div></div>`;
  $('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
  document.body.style.overflow='hidden';
  if(!was&&!sheetHist){ try{ history.pushState({darSheet:1},'',location.href); sheetHist=true; }catch(e){ sheetHist=false; } }
}
/* mode: undefined — closed by user (remove its history entry); 'pop' — history already went back; 'nav' — caller replaces the entry */
function closeSheet(mode){
  $('#layer').innerHTML=''; document.body.style.overflow='';
  if(!sheetHist) return false;
  sheetHist=false;
  if(mode==='pop') return false;
  if(mode==='nav') return true;
  ignorePop++; clearTimeout(ignoreTimer); ignoreTimer=setTimeout(()=>{ ignorePop=0; },900);
  try{ history.back(); }catch(e){ ignorePop=0; }
  return false;
}

const RALIAS={parent:'parent',parents:'parent',student:'student',pupil:'student',teacher:'teacher',admin:'admin',administration:'admin',director:'admin'};
const AUTHH={signin:'signin',login:'signin',auth:'signin',vhod:'signin','signin-code':'code'};
const slugOf=id=>HSLUG[id]||id;
function findScreen(role,x){ if(!x) return ROLES[role].screens[0].id; const y=SALIAS[x]||x; const s=ROLES[role].screens.find(s=>s.id===y||slugOf(s.id)===x); return s?s.id:null; }
function parseHash(raw,qRole){
  let h=(raw||'').replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){} h=h.toLowerCase().trim();
  if(!h) return qRole?{role:qRole,screen:ROLES[qRole].screens[0].id}:null;
  if(AUTHH[h]) return {role:'auth',screen:AUTHH[h]};
  const parts=h.split('-'), r=RALIAS[parts[0]]||null;
  const pick=(role,rest)=>{ if(!rest.length) return {role,screen:ROLES[role].screens[0].id,sub:''}; let s=findScreen(role,rest.join('-')); if(s) return {role,screen:s,sub:''}; s=findScreen(role,rest[0]); if(s) return {role,screen:s,sub:rest.slice(1).join('-')}; return null; };
  if(r) return pick(r,parts.slice(1))||{role:r,screen:ROLES[r].screens[0].id,sub:''};
  if(qRole){ const x=pick(qRole,parts); if(x) return x; }
  const owners=Object.keys(ROLES).filter(k=>pick(k,parts));
  if(!owners.length) return null;
  return pick(owners.includes(S.role)?S.role:owners[0],parts);
}
function applyRoute(p){ S.role=p.role; S.screen=p.screen; if(p.role!=='auth'){ authed(true); store.set('role',p.role); if(p.screen==='chat') S.thread=(p.sub&&S.threads.some(t=>t.id===p.sub))?p.sub:null; } }
const hashNow=()=>{ if(S.role==='auth') return S.screen==='code'?'signin-code':'signin'; let h=`${S.role}-${slugOf(S.screen)}`; if(S.role==='parent'&&S.screen==='chat'&&S.thread&&!isWide()) h+='-'+S.thread; return h; };
/* NAV mirrors the in-app part of browser history, so «Назад» knows whether it can go back */
const NAV=[];
function setURL(mode){ /* true/'push' — new entry; false/'replace' — replace current; 'sheet' — replace the sheet's entry */
  if(mode===true) mode='push'; if(mode===false||mode==null) mode='replace';
  const h=hashNow(), cur=location.hash.replace(/^#/,'');
  if(cur===h){ if(mode==='sheet'){ ignorePop++; clearTimeout(ignoreTimer); ignoreTimer=setTimeout(()=>{ ignorePop=0; },900); try{ history.back(); }catch(e){ ignorePop=0; } } if(!NAV.length) NAV.push(h); return; }
  if(mode==='push'){ try{ location.hash=h; }catch(e){} NAV.push(h); return; }
  try{ history.replaceState(null,'','#'+h); }catch(e){ try{ location.replace('#'+h); }catch(_){} }
  if(mode==='sheet'||!NAV.length) NAV.push(h); else NAV[NAV.length-1]=h;
}
function go(id,push=true){ const viaSheet=closeSheet('nav'); S.screen=id; render(); window.scrollTo(0,0); setURL(viaSheet?'sheet':push); }
function readURL(){
  let q=null; try{ q=new URLSearchParams(location.search).get('role'); }catch(e){}
  q=q&&RALIAS[q.toLowerCase()]||null;
  S.role=store.get('role','parent'); if(!ROLES[S.role]) S.role='parent';
  const p=parseHash(location.hash,q);
  if(p){ applyRoute(p); if(p.role==='auth'&&p.screen==='code') S.screen='signin'; }
  else if(q){ S.role=q; S.screen=ROLES[q].screens[0].id; authed(true); }
  else if(store.get('authed',false)){ S.screen=ROLES[S.role].screens[0].id; }
  else { S.role='auth'; S.screen='signin'; }
}
function onNav(e){
  if(e&&e.type==='popstate'&&ignorePop>0){ ignorePop--; return; }
  const h=location.hash.replace(/^#/,'');
  if($('#ov')) closeSheet('pop');
  if(NAV.length>1&&NAV[NAV.length-2]===h) NAV.pop(); else if(NAV[NAV.length-1]!==h) NAV.push(h);
  const p=parseHash(location.hash,null); if(!p) return;
  if(p.role==='auth'&&p.screen==='code'&&!AUTH.phone) p.screen='signin';
  const sameThread=p.screen!=='chat'||isWide()||((p.sub&&S.threads.some(t=>t.id===p.sub))?p.sub:null)===(S.thread||null);
  if(p.role===S.role&&p.screen===S.screen&&sameThread) return;
  applyRoute(p); render(); window.scrollTo(0,0);
}

function subjStats(k){ const res={}; Object.keys(GR[k.id]).sort().forEach(key=>{ const d=pk(key); Object.entries(GR[k.id][key]).forEach(([s,g])=>{ const s0=s==='pool'?'pe':s; const o=res[s0]=res[s0]||{all:[],q1:[],q2:[]}; o.all.push(g.v); (d<=Q1END?o.q1:o.q2).push(g.v); }); }); return res; }
function weeklyAvg(k){ const out=[]; for(let m=monday(START); m<=TODAY; m=add(m,7)){ const vals=[]; for(let i=0;i<5;i++){ const G=GR[k.id][dk(add(m,i))]; if(G) Object.values(G).forEach(g=>vals.push(g.v)); } if(vals.length) out.push({l:`${m.getDate()}.${String(m.getMonth()+1).padStart(2,'0')}`,v:avg(vals)}); } return out; }

    ${offs?`<div class="note green" style="margin-top:12px">${ic('food')}<span>Перерасчёт за питание: −${rub(offs*LUNCH_PRICE)} (${offs} ${plural(offs,'отказ','отказа','отказов')}) — учтём в счёте за январь.</span></div>`:''}</section>`;
  const hist=`<section class="card paper"><div class="ch"><h3>История</h3><button class="lnk" data-a="toast" data-v="Акт сверки за 2026 год отправлен на почту">Акт сверки${ic('download')}</button></div><div class="list">${paid.map(i=>`<div class="li"><span class="ib">${ic('check')}</span><span class="li-b"><span class="li-t">${i.t}</span><span class="li-s">${i.who} · оплачено ${i.at}</span></span><b class="nowrap">${rub(i.sum)}</b></div>`).join('')}</div>

  return `<div class="mas">${sum}${list}${hist}</div>`;
};
A.autopay=()=>{ S.autopay=!S.autopay; toast(S.autopay?'Автоплатёж подключён':'Автоплатёж отключён', S.autopay?'check':'x'); refresh(); };
A.pay=v=>{ const ids=v==='all'?S.invoices.filter(i=>i.st==='due').map(i=>i.id):[v]; const inv=S.invoices.filter(i=>ids.includes(i.id)); const sum=inv.reduce((a,i)=>a+i.sum,0); if(!inv.length) return;
  sheet('Оплата по СБП',`<div class="center" id="sbp"><div class="big">${rub(sum)}</div><p class="muted small" style="margin-top:6px">${inv.map(i=>i.t+' — '+i.who.split(' · ')[0]).join('<br>')}</p><div class="qr">${qrSVG(ids.join())}</div>
    <p class="small muted">Отсканируйте QR-код камерой другого телефона или откройте приложение банка прямо отсюда. Комиссия — 0 ₽.</p>
    <button class="btn block" style="margin-top:16px" data-a="payGo" data-v="${ids.join(',')}">${ic('phone')}Открыть приложение банка</button>
    <p class="tiny" style="margin-top:10px">Демо: деньги не списываются, банк не открывается.</p></div>`); };

  setTimeout(()=>{ const inv=S.invoices.filter(i=>ids.includes(i.id)); inv.forEach(i=>{ i.st='paid'; i.at='18 ноября'; }); const b=$('#sbp'); if(b) b.innerHTML=`<div class="okc">${ic('check')}</div><div class="big" style="font-size:26px">Оплачено</div><p class="muted" style="margin-top:6px">${rub(inv.reduce((a,i)=>a+i.sum,0))} · чек № ${4800+Math.floor(Math.random()*90)} отправлен на почту</p><button class="btn block" style="margin-top:18px" data-a="closeSheet">Готово</button>`; refresh(); },1400); };

V['parent:shop']=()=>{

  S.cart[v+'|']=(S.cart[v+'|']||0)+1; toast(`${p.n} — в корзине`,'bag'); refresh(); };

   <div class="lbl" style="margin:16px 0 8px">Оплата</div><div class="opts">${[['invoice','Добавить в счёт за декабрь','Одна оплата за всё'],['sbp','Оплатить сейчас по СБП','QR-код или приложение банка']].map(o=>`<button class="opt ${S.shopPay===o[0]?'on':''}" data-a="shopPay" data-v="${o[0]}"><span class="radio"></span><span class="li-b"><span class="li-t">${o[1]}</span><span class="li-s">${o[2]}</span></span></button>`).join('')}</div>
   <button class="btn block" style="margin-top:18px" data-a="order">Оформить · ${rub(total)}</button>`); };

  const cards=list.map(h=>{ const [l,t]=dueLabel(h), dn=h.steps.filter(x=>x[1]).length; return `<section class="card ${hwDone(h)?'paper':''}"><div class="ch"><span class="tag">${sshort(h.s)}</span><span class="tag ${t}">${l}</span></div><h3 style="font-size:19px;line-height:1.3">${h.title}</h3><p class="tiny" style="margin-top:4px">${tOf(h.s).s} · ≈ ${h.est} мин · срок ${fdw(pk(h.due))}</p>

function subjGrades(k){ const res={}; Object.keys(GR[k.id]).sort().forEach(key=>{ Object.entries(GR[k.id][key]).forEach(([s,g])=>{ (res[s]=res[s]||[]).push({key,s,g}); }); }); return res; }

V['student:grades']=()=>{
  const sg=subjGrades(ME), wk=weeklyAvg(ME), vals=wk.map(w=>w.v);
  const allv=[].concat(...Object.values(sg).map(a=>a.map(x=>x.g.v)));
  const mn=Math.min(4,Math.floor(Math.min(...vals)*2-0.3)/2), tks=[]; for(let t=mn;t<=5.001;t+=0.5) tks.push(t);
  const chart=`<section class="card dark"><div class="ch"><h3>Средний балл</h3><span class="k">с 1 сентября</span></div><div class="counter">${fx(avg(allv),2)}</div><div class="tiny" style="color:#C6CFBF;margin:4px 0 6px">${allv.length} оценок · пятёрок ${allv.filter(v=>v===5).length}</div>${lineChart(vals,{min:mn,max:5,ticks:tks,labels:wk.map(w=>w.l),h:130})}</section>`;
  const rows=Object.entries(sg).map(([s,a])=>({s,a,av:avg(a.slice(-6).map(x=>x.g.v))})).sort((x,y)=>y.av-x.av);

  return `<div class="mas">${chart}${list}</div>`;
};

A.club=v=>{ const c=S.clubs.find(x=>x.id===v); if(!c) return;
  if(S.my[v]){ delete S.my[v]; c.cnt--; toast(`Ты вышел из кружка «${c.n}»`,'undo'); }
  else if(S.waitl[v]){ delete S.waitl[v]; c.wait=Math.max(0,c.wait-1); toast('Заявка в лист ожидания отменена','undo'); }
  else if(c.cnt<c.cap){ S.my[v]=true; c.cnt++; toast(c.price?`Записан в «${c.n}». Родители получат счёт на ${rub(c.price)}`:`Записан в «${c.n}». Родители получили уведомление`,'star'); }
  else { c.wait++; S.waitl[v]=c.wait; toast(`Ты в листе ожидания: ${c.wait}-й`,'clock'); }
  refresh(); };

const FEM=new Set(['Ева','Полина','Варвара','София','Милана','Ксения','Анна','Вероника','Мирослава','Дарья','Алиса','Кира','Ани','Ульяна','Маргарита','Алёна','Таисия','Виктория','Елизавета']);
const T_LESSONS=[{n:1,cls:'9Б',s:'alg',topic:LESSON_TOPIC['9Б']},{n:3,cls:'5Б',s:'math',topic:'Сравнение дробей'},{n:4,cls:'5А',s:'math',topic:LESSON_TOPIC['5А']},{n:5,cls:'9А',s:'geom',topic:'Теорема синусов'}];
const SAVE_L={journal:'Журнал вместо бумаги',hw:'ДЗ всем классам сразу',ai:'Письма родителям с ИИ',meet:'Запись на встречи без переписки'};
function addSaved(m,key){ S.saved+=m; S.savedBy[key]+=m; }
const stOf=(cls,i)=>ST[cls][i];
function signalSt(sg){ return ST[sg.cls].find(x=>x.full===sg.st); }

SUB['teacher:today']=()=>`Среда, ${fd(TODAY)} · 4 урока, классное руководство 5А`;
V['teacher:today']=()=>{
  const saved=`<section class="card dark"><button class="saved-row" data-a="savedInfo"><span><span class="tiny" style="color:#C6CFBF;display:block">Сэкономлено за неделю</span><span class="counter">${minsLabel(S.saved)}</span></span><span class="lnk" style="margin-left:auto;color:#D2B888">Подробнее${ic('chevR')}</span></button></section>`;
  const les=`<section class="card"><div class="ch"><h3>Уроки сегодня</h3><span class="k">каб. 204</span></div><div class="list">${T_LESSONS.map(l=>{ const b=BELLS[l.n-1], st=NOW>=b[1]?'past':NOW>=b[0]?'now':'future'; return `<button class="li" data-a="openJ" data-v="${l.cls}"><span class="date-b" style="${st==='now'?'background:var(--green)':''}"><b style="${st==='now'?'color:#F7F3E9':''}">${l.n}</b><small style="${st==='now'?'color:#C6CFBF':''}">${hm(b[0])}</small></span><span class="li-b"><span class="li-t">${l.cls} · ${sname(l.s)}</span><span class="li-s">${l.topic}</span></span>${st==='past'?(S.jsaved[l.cls]?'<span class="tag green">журнал ✓</span>':'<span class="tag wine">заполнить</span>'):st==='now'?'<span class="tag dark">идёт</span>':''}${ic('chevR')}</button>`; }).join('')}</div></section>`;
  const sig=S.signals.filter(x=>!x.done);
  const att=`<section class="card paper"><div class="ch"><h3>Требуют внимания</h3><span class="tag wine">${sig.length}</span></div><div class="list">${sig.slice(0,3).map(x=>`<button class="li" data-a="go" data-v="attention"><span class="ib ${x.sev==='high'?'wine':'gold'}">${ic('alert')}</span><span class="li-b"><span class="li-t">${x.st.split(' ').reverse().join(' ')}, ${x.cls}</span><span class="li-s">${x.title}</span></span>${spark(signalSt(x).gr.map(g=>g.v),{w:56,h:20,color:x.sev==='high'?'var(--burg)':'var(--gold)'})}</button>`).join('')||'<p class="muted">Сигналов нет.</p>'}</div></section>`;
  const bk=[]; SLOT_DATES.forEach(d=>SLOT_TIMES.forEach(t=>{ const v=S.slots.mor[d][t]; if(v&&typeof v==='object') bk.push({d,t,v}); }));
  const meet=`<section class="card"><div class="ch"><h3>Встречи с родителями</h3></div><div class="list">${bk.slice(0,3).map(x=>`<div class="li"><span class="date-b"><b>${pk(x.d).getDate()}</b><small>${WDS[pk(x.d).getDay()]}</small></span><span class="li-b"><span class="li-t">${x.t} · ${x.v.by}</span><span class="li-s">${x.v.topic} · ${x.v.fmt==='online'?'онлайн':'каб. 204'}</span></span>${x.v.mine?'<span class="tag wine">новая</span>':''}</div>`).join('')}</div><div class="more-row"><button class="lnk" data-a="go" data-v="slots">Все встречи · ${bk.length}${ic('chevR')}</button></div></section>`;
  return `<div class="mas m3">${les}${att}${meet}${saved}</div>`;
};
A.savedInfo=()=>sheet('Сэкономлено времени',`<div class="counter" style="color:var(--green)">${minsLabel(S.saved)}</div><p class="muted" style="margin:4px 0 14px">за эту неделю · с 1 сентября — ${61+Math.floor((S.saved-232)/60)} ч, примерно 8 рабочих дней</p>
  ${Object.entries(S.savedBy).map(([k,v])=>hbar(SAVE_L[k],v,Math.max(...Object.values(S.savedBy)),{right:`${v} мин`,cls:'gold'})).join('')}
  <p class="tiny" style="margin-top:12px">Сравнение с бумажным журналом и перепиской в мессенджерах. Счётчик растёт, когда вы пользуетесь журналом, заданиями и письмами.</p>`);
A.openJ=v=>{ S.jcls=v; S.jopen=null; go('journal'); };

/* journal */
SUB['teacher:journal']='Присутствие и оценки за урок. После сохранения родители получат уведомление.';
V['teacher:journal']=()=>{
  const cls=S.jcls, J=S.journal[cls], list=ST[cls], l=T_LESSONS.find(x=>x.cls===cls), b=BELLS[l.n-1];
  const attOf=i=>J.att[i]||'p', present=list.filter((_,i)=>attOf(i)!=='n').length, graded=Object.keys(J.gr).length;
  const seg=`<div class="hs" style="margin-bottom:14px">${T_LESSONS.map(x=>{ const bb=BELLS[x.n-1], st=NOW>=bb[1]?'past':NOW>=bb[0]?'now':'future'; return `<button class="dayt ${cls===x.cls?'on':''}" data-a="jcls" data-v="${x.cls}" aria-pressed="${cls===x.cls}"><b>${x.cls}</b><small>${x.n} урок</small>${st==='now'?'<i></i>':''}</button>`; }).join('')}</div>`;
  const head=`<section class="card dark" style="margin-bottom:14px"><div class="ch"><h3>${cls} · ${sname(l.s)}</h3><span class="k">${l.n} урок · ${hm(b[0])}–${hm(b[1])}</span></div><p style="color:#E9E4D6">Тема: ${l.topic}</p>
    <div style="display:flex;gap:22px;margin-top:14px;flex-wrap:wrap"><div><div class="counter" style="font-size:32px">${present}<small>/${list.length}</small></div><div class="tiny" style="color:#C6CFBF">присутствуют</div></div><div><div class="counter" style="font-size:32px">${graded}</div><div class="tiny" style="color:#C6CFBF">${plural(graded,'оценка','оценки','оценок')} за урок</div></div>${S.jsaved[cls]?`<div><div class="counter" style="font-size:32px">${ic('check',28)}</div><div class="tiny" style="color:#C6CFBF">сохранено в ${S.jsaved[cls]}</div></div>`:''}</div>
    <div class="btns" style="margin-top:14px"><button class="btn light sm" data-a="allP">${ic('check')}Все присутствуют</button><button class="btn ghost sm" data-a="toast" data-v="Тема и домашнее задание подставлены из плана уроков">${ic('book')}Тема из плана</button></div></section>`;
  const rows=list.map((st,i)=>{ const a=attOf(i), g=J.gr[i]; return `<div class="jr"><span class="tiny tnum" style="font-weight:700;text-align:right">${i+1}</span><span style="min-width:0"><span class="jr-n" style="display:block">${st.last} ${st.first}</span><span class="jr-s" style="display:block">${J.cm[i]?esc(J.cm[i]):'ср. '+fx(avg(st.gr.slice(-5).map(x=>x.v)),1)}${st.absences>=3?' · пропуски':''}</span></span>
    <button class="att ${a}" data-a="att" data-v="${i}" aria-label="Присутствие">${a==='p'?ic('check',16):a==='n'?'Н':'ОП'}</button>
    ${g?`<button class="g g${g}" data-a="gopen" data-v="${i}" aria-label="Оценка ${g}">${g}</button>`:`<button class="gcell" data-a="gopen" data-v="${i}" aria-label="Поставить оценку" ${a==='n'?'disabled style="opacity:.3"':''}>${ic('plus',16)}</button>`}
    ${S.jopen===i?`<div class="gpick">${[5,4,3,2].map(v=>`<button class="g g${v}" data-a="gset" data-v="${i}|${v}">${v}</button>`).join('')}<button class="gcell" style="border-style:solid" data-a="gset" data-v="${i}|0" aria-label="Убрать">${ic('x',16)}</button>
      <span style="flex-basis:100%;height:2px"></span>${['Ответ у доски','Самостоятельная','Не готов к уроку','Ошибки в вычислениях'].map(c=>`<button class="chip" data-a="gcm" data-v="${i}|${c}">${c}</button>`).join('')}</div>`:''}</div>`; }).join('');
  return seg+head+`<section class="card"><div class="ch"><h3>${list.length} ${plural(list.length,'ученик','ученика','учеников')}</h3></div><p class="tiny" style="margin:-6px 0 6px">Нажмите на отметку: ${ic('check',14)} на уроке → Н — нет → ОП — опоздал. «+» — поставить оценку.</p>${rows}
    <button class="btn block" style="margin-top:16px" data-a="jsave">${ic('check')}Сохранить${graded?` · ${graded} ${plural(graded,'оценка','оценки','оценок')} родителям`:''}</button></section>`;
};
A.jcls=v=>{ S.jcls=v; S.jopen=null; refresh(); };
A.att=v=>{ const J=S.journal[S.jcls], c=J.att[v]||'p'; J.att[v]=c==='p'?'n':c==='n'?'l':'p'; if(J.att[v]==='n'){ delete J.gr[v]; if(S.jopen==v) S.jopen=null; } refresh(); };
A.gopen=v=>{ const i=Number(v); S.jopen=S.jopen===i?null:i; refresh(); };
A.gset=v=>{ const [i,g]=v.split('|').map(Number); const J=S.journal[S.jcls]; if(g) J.gr[i]=g; else { delete J.gr[i]; delete J.cm[i]; } S.jopen=null; refresh(); };
A.gcm=v=>{ const [i,c]=v.split('|'); const J=S.journal[S.jcls]; J.cm[i]=c; if(!J.gr[i]) J.gr[i]=c==='Не готов к уроку'?2:c==='Ошибки в вычислениях'?3:5; S.jopen=null; refresh(); };
A.allP=()=>{ S.journal[S.jcls].att={}; toast('Все отмечены присутствующими','check'); refresh(); };
A.jsave=()=>{ const J=S.journal[S.jcls], n=Object.keys(J.gr).length, abs=Object.values(J.att).filter(x=>x==='n').length; S.jsaved[S.jcls]=clockNow(); addSaved(6,'journal'); toast(`Журнал ${S.jcls} сохранён. ${n?`Родители получили ${n} ${plural(n,'уведомление','уведомления','уведомлений')} об оценках`:'Оценок за урок нет'}${abs?`, о ${abs} ${plural(abs,'пропуске','пропусках','пропусках')} — тоже`:''} · +6 мин`,'check'); refresh(); };

/* assign */
const HW_CLASSES=[['5А',22],['5Б',22],['9А',24],['9Б',20]];
const HW_LOAD={'5А':{'2026-11-19':70,'2026-11-20':55,'2026-11-23':40},'5Б':{'2026-11-19':60,'2026-11-20':95,'2026-11-23':35},'9А':{'2026-11-19':120,'2026-11-20':150,'2026-11-23':90},'9Б':{'2026-11-19':135,'2026-11-20':110,'2026-11-23':80}};
const HW_NORM=c=>c[0]==='5'?120:210;
SUB['teacher:assign']='Одно задание — сразу в несколько классов, с проверкой нагрузки.';
V['teacher:assign']=()=>{
  const sel=HW_CLASSES.filter(c=>S.hwSel[c[0]]).map(c=>c[0]);
  const load=sel.map(c=>{ const cur=HW_LOAD[c][S.hwDue]||0, tot=cur+S.hwMin, norm=HW_NORM(c); return {c,cur,tot,norm,over:tot>norm*0.85}; });
  const form=`<section class="card"><div class="field"><label class="lbl" for="hwT">Задание</label><textarea class="inp" id="hwT" data-bind="hwText">${esc(S.hwText)}</textarea></div>
    <div class="field"><span class="lbl">Классы</span><div class="chips">${HW_CLASSES.map(c=>`<button class="chip ${S.hwSel[c[0]]?'on':''}" data-a="hwCls" data-v="${c[0]}" aria-pressed="${!!S.hwSel[c[0]]}">${S.hwSel[c[0]]?ic('check'):''}${c[0]} <small>${c[1]} уч.</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Срок</span><div class="chips">${SLOT_DATES.slice(0,3).map(d=>`<button class="chip ${S.hwDue===d?'on':''}" data-a="hwDue" data-v="${d}">${fdw(pk(d))}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Время на выполнение</span><div class="chips">${[15,30,45].map(m=>`<button class="chip ${S.hwMin===m?'on':''}" data-a="hwMin" data-v="${m}">${m} мин</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Материалы</span><div class="chips"><button class="chip ${S.hwFile?'on':''}" data-a="hwFile">${ic('clip')}${S.hwFile?'Карточка_дроби.pdf':'Прикрепить файл'}</button><button class="chip" data-a="hwBank">${ic('book')}Из банка заданий</button></div></div>
    <button class="btn block" data-a="hwPub" ${sel.length&&S.hwText.trim()?'':'disabled'}>${ic('send')}Опубликовать ${sel.length?`в ${sel.length} ${plural(sel.length,'классе','классах','классах')}`:''}</button></section>`;
  const loadC=`<section class="card paper"><div class="ch"><h3>Нагрузка на ${fdw(pk(S.hwDue))}</h3><span class="k">все предметы</span></div>${load.length?load.map(x=>hbar(`<b>${x.c}</b>`,x.tot,x.norm,{right:`${x.tot} / ${x.norm} мин`,cls:x.over?'wine':''})).join(''):'<p class="muted">Выберите классы.</p>'}
    ${load.some(x=>x.over)?`<div class="note wine" style="margin-top:12px">${ic('alert')}<span>В ${load.filter(x=>x.over).map(x=>x.c).join(', ')} нагрузка близка к норме СанПиН. Возможно, стоит перенести срок.</span></div>`:`<div class="note green" style="margin-top:12px">${ic('check')}<span>Нагрузка в пределах нормы СанПиН 1.2.3685-21 (5 класс — до 2 ч, 9 класс — до 3,5 ч).</span></div>`}</section>`;
  const pub=`<section class="card"><div class="ch"><h3>Опубликовано</h3><span class="k">${S.tHw.length}</span></div><div class="list">${S.tHw.map(h=>{ const tot=h.classes.reduce((a,c)=>a+(HW_CLASSES.find(x=>x[0]===c)||[0,20])[1]*2,0); return `<div class="li" style="align-items:flex-start"><span class="ib">${ic('tasks')}</span><span class="li-b"><span class="li-t">${esc(h.text)}</span><span class="li-s">${h.classes.join(', ')} · срок ${fdw(pk(h.due))}${h.att?' · '+h.att:''}</span><span style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="bar" style="flex:1;height:6px"><i style="width:${h.seen[0]/tot*100}%"></i></span><span class="tiny tnum">${ic('eye',13)} ${h.seen[0]}/${tot}</span></span></span></div>`; }).join('')}</div><p class="tiny" style="margin-top:10px">Счётчик — сколько учеников и родителей открыли задание.</p></section>`;
  return `<div class="split rev"><div class="stack">${form}${pub}</div>${loadC}</div>`;
};
A.hwCls=v=>{ S.hwSel[v]=!S.hwSel[v]; refresh(); };
A.hwDue=v=>{ S.hwDue=v; refresh(); };
A.hwMin=v=>{ S.hwMin=Number(v); refresh(); };
A.hwFile=()=>{ S.hwFile=!S.hwFile; refresh(); };
const HW_BANK=['Задача на движение: два велосипедиста выехали навстречу друг другу… (банк ФИПИ, № 2417)','Сравните дроби 7/12 и 5/8, объясните способ (банк ФИПИ, № 1093)','Найдите значение выражения 3/4 + 5/6 − 1/3 (банк ФИПИ, № 1288)'];
A.hwBank=()=>{ const t=HW_BANK[(S.hwBankI=(S.hwBankI||0))%HW_BANK.length]; S.hwBankI++; S.hwText=(S.hwText.trim()?S.hwText.trim()+'\n':'')+t; toast('Задание из банка добавлено в текст','book'); refresh(); };
A.hwPub=()=>{ const sel=HW_CLASSES.filter(c=>S.hwSel[c[0]]).map(c=>c[0]); if(!sel.length||!S.hwText.trim()) return; const h={text:S.hwText.trim(),classes:sel,due:S.hwDue,seen:[0,0],att:S.hwFile?'Карточка_дроби.pdf':''}; S.tHw.unshift(h); sel.forEach(c=>{ HW_LOAD[c][S.hwDue]=(HW_LOAD[c][S.hwDue]||0)+S.hwMin; });
  const m=3+4*(sel.length-1); addSaved(m,'hw'); toast(`Задание опубликовано в ${sel.join(', ')} · +${m} мин`,'send'); S.hwText=''; S.hwFile=false; refresh();
  setTimeout(()=>{ h.seen[0]=Math.round(sel.length*9); if(S.screen==='assign') refresh(); },1800); };

/* AI feedback */
function fbDraft(st,tone){
  const g=st.gr, rec=g.slice(-5), prev=g.slice(0,5), a1=avg(rec.map(x=>x.v)), a0=avg(prev.map(x=>x.v)), d=a1-a0, fem=FEM.has(st.first);
  const byT={}; g.forEach(x=>(byT[x.topic]=byT[x.topic]||[]).push(x.v));
  const tops=Object.entries(byT).map(([t,v])=>[t,avg(v)]).sort((a,b)=>b[1]-a[1]);
  const best=tops[0][0], weak=tops[tops.length-1][0], wA=tops[tops.length-1][1];
  const trend=d>0.3?'заметный рост к началу четверти':d<-0.3?'снижение по сравнению с началом четверти':'стабильный результат';
  const subj=st.cls[0]==='5'?'математике':'алгебре';
  const weakTxt=wA<4.2?`Чуть больше внимания стоит уделить теме «${weak}»: дома достаточно 15 минут на 3–4 задачи из учебника, а на консультации в четверг в 15:20 разберём ошибки вместе.`:`Серьёзных пробелов не вижу — можно попробовать задачи повышенной сложности.`;
  const absTxt=st.absences>=3?` За две недели — ${st.absences} ${plural(st.absences,'пропуск','пропуска','пропусков')}; давайте вместе проследим, чтобы пропущенные темы были закрыты.`:'';
  if(tone==='short') return `${st.parent}, добрый день! ${st.first}, ${subj}: средний балл ${fx(a1,1)} — ${trend}. Сильная тема — «${best}». ${wA<4.2?`Подтянуть — «${weak}», консультация по четвергам в 15:20.`:'Пробелов нет.'}${st.absences>=3?` Пропусков за две недели: ${st.absences}.`:''}\nЕ. В. Морозова`;
  if(tone==='formal') return `Уважаемый(ая) ${st.parent}!\n\nИнформирую об успеваемости ${fem?'ученицы':'ученика'} ${st.cls} класса ${st.first} ${st.last} по ${subj} за период с 6 октября по 18 ноября.\n\nСредний балл за последние пять работ — ${fx(a1,1)}, за предыдущие пять — ${fx(a0,1)}; динамика: ${trend}. Лучше всего освоена тема «${best}». ${weakTxt}${absTxt}\n\nГотова обсудить результаты на встрече — время можно выбрать в приложении.\n\nС уважением,\nЕ. В. Морозова, учитель математики`;
  return `Здравствуйте, ${st.parent}!\n\nКоротко о том, как идут дела по ${subj} за последние недели. У ${fem?'неё':'него'} средний балл ${fx(a1,1)} — ${trend}. Особенно хорошо получается тема «${best}»: видно, что ${st.first} ${fem?'разобралась':'разобрался'} и работает уверенно.\n\n${weakTxt}${absTxt}\n\nЕсли удобно, запишитесь на встречу в приложении — обсудим подробнее.\n\nС теплом,\nЕлена Викторовна`;
}
SUB['teacher:feedback']='Черновик письма из оценок и пропусков ученика. Вы правите и отправляете.';
V['teacher:feedback']=()=>{
  const list=ST[S.fbCls]; if(S.fbSt>=list.length) S.fbSt=0; const st=list[S.fbSt];
  const rec=st.gr.slice(-5), prev=st.gr.slice(0,5), a1=avg(rec.map(x=>x.v)), a0=avg(prev.map(x=>x.v));
  const pick=`<section class="card"><div class="seg">${['5А','9Б'].map(c=>`<button class="${S.fbCls===c?'on':''}" data-a="fbCls" data-v="${c}">${c}</button>`).join('')}</div>
    <div class="field"><label class="lbl" for="fbSel">Ученик</label><select class="inp" id="fbSel" data-ch="fbSt">${list.map((x,i)=>`<option value="${i}" ${i===S.fbSt?'selected':''}>${x.last} ${x.first}</option>`).join('')}</select></div>
    <div class="lbl" style="margin-bottom:8px">Данные для черновика</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${st.gr.map(x=>`<span class="g g${x.v} sm" title="${esc(x.topic)}">${x.v}</span>`).join('')}</div>
