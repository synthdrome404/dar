V['admin:admissions']=()=>{
  const fn=funnel(), mx=fn[0];
  const f=`<section class="card"><div class="ch"><h3>Воронка поступления</h3><span class="k">с 1 сентября</span></div><div class="fn">${fn.map((v,i)=>`${i?`<div class="fn-c">${ic('down',13)} ${Math.round(v/fn[i-1]*100)}%</div>`:''}<div class="fn-b" style="width:${Math.max(46,v/mx*100)}%;${i===3?'background:var(--burg)':i===2?'background:var(--green2)':''}"><span>${STAGES[i]}</span><b>${v}</b></div>`).join('')}</div>
    <div class="kpis" style="margin-top:16px;grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi" style="background:var(--paper)"><span class="kpi-l">Конверсия заявка → договор</span><span class="kpi-v">${Math.round(fn[3]/fn[0]*100)}%</span></div><div class="kpi" style="background:var(--paper)"><span class="kpi-l">План по договорам</span><span class="kpi-v">${fn[3]}<small> / ${ADM_TARGET}</small></span></div></div></section>`;
  const src=`<section class="card paper"><div class="ch"><h3>Откуда приходят</h3><span class="k">заявки</span></div>${SOURCES.map((x,i)=>hbar(x[0],x[1],SOURCES[0][1],{cls:i?'lt':''})).join('')}<p class="tiny" style="margin-top:8px">Рекомендации семей дают лучшую конверсию в договор — 41%.</p></section>`;
  const leads=`<section class="card"><div class="ch"><h3>Кандидаты</h3><button class="lnk" data-a="leadNew">${ic('plus')}Заявка</button></div><div class="list">${S.leads.map(l=>`<div class="li" style="align-items:flex-start"><span class="av ${l.st===3?'g':''}">${l.n.split(' ').map(w=>w[0]).join('')}</span><span class="li-b"><span class="li-t">${l.n}</span><span class="li-s">${l.g} · ${l.src} · ${l.next}</span><span class="stage" style="margin-top:8px">${STAGES.map((s,i)=>`<i class="${i<=l.st?'on':''}" title="${s}"></i>`).join('')}</span><span class="tiny" style="display:block;margin-top:4px">${STAGES[l.st]}</span></span>${l.st<3?`<button class="btn xs sec" data-a="lead" data-v="${l.id}">Дальше ${ic('chevR',14)}</button>`:'<span class="tag green">договор</span>'}</div>`).join('')}</div></section>`;
  return `<div class="mas">${f}${leads}${src}</div>`;
};
A.leadNew=()=>{ S.lnG=S.lnG||'1 класс'; S.lnSrc=S.lnSrc||'Звонок'; sheet('Новая заявка',`<div class="field"><label class="lbl" for="lnName">Фамилия и имя ребёнка</label><input class="inp" id="lnName" autocomplete="off" placeholder="Например: Петров Иван"></div>
  <div class="field"><span class="lbl">Куда поступает</span><div class="chips">${['Детский сад','1 класс','5 класс','8 класс','10 класс'].map(g=>`<button class="chip ${S.lnG===g?'on':''}" data-a="lnG" data-v="${g}">${g}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Откуда узнали</span><div class="chips">${['Звонок','Рекомендация','Сайт','Соцсети'].map(g=>`<button class="chip ${S.lnSrc===g?'on':''}" data-a="lnSrc" data-v="${g}">${g}</button>`).join('')}</div></div>
  <div id="lnErr"></div><button class="btn block" data-a="leadSave">Добавить заявку</button><p class="tiny" style="margin-top:10px">Заявки с сайта попадают сюда автоматически.</p>`); };
A.lnG=v=>{ S.lnG=v; document.querySelectorAll('[data-a="lnG"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); };
A.lnSrc=v=>{ S.lnSrc=v; document.querySelectorAll('[data-a="lnSrc"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); };
A.leadSave=()=>{ const n=(($('#lnName')||{}).value||'').trim(); if(n.split(/\s+/).length<2){ const e=$('#lnErr'); if(e) e.innerHTML=`<p class="auth-err" role="alert">${ic('alert')}<span>Укажите фамилию и имя</span></p>`; return; }
  S.leads.unshift({id:'l'+Date.now(),n:esc(n),g:S.lnG,st:0,src:S.lnSrc,next:'Позвонить сегодня'}); S.funnelAdd[0]++; closeSheet(); toast(`Заявка добавлена: ${esc(n)}`,'funnel'); refresh(); };
A.lead=v=>{ const l=S.leads.find(x=>x.id===v); if(!l||l.st>=3) return; l.st++; S.funnelAdd[l.st]++; l.next=['','Экскурсия назначена','Тестирование назначено','Договор подписан сегодня'][l.st]; toast(`${l.n}: этап «${STAGES[l.st]}»`, l.st===3?'sign':'check'); refresh(); };

/* finance */
SUB['admin:finance']='Начисления, поступления и долги. Напоминание семье — в один тап.';
V['admin:finance']=()=>{
  const parentPaid=S.invoices.filter(i=>i.st==='paid'&&i.at==='18 ноября').reduce((a,i)=>a+i.sum,0);
  const charged=28160000, paid=26920000+parentPaid;
  const top=`<section class="card dark"><div class="ch"><h3>Ноябрь</h3><span class="k">все услуги</span></div><div class="counter">${fx(paid/charged*100,1)}%</div><p style="color:#C6CFBF;margin:4px 0 14px">поступило ${rub(paid)} из ${rub(charged)}</p><div class="bar"><i style="width:${paid/charged*100}%"></i></div>
    <div class="kpis" style="margin-top:16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div class="kpi" style="background:rgba(247,243,233,.08)"><span class="kpi-l" style="color:#C6CFBF">Сегодня по СБП</span><span class="kpi-v" style="color:#F7F3E9;font-size:22px">${rub(255000+parentPaid)}</span></div><div class="kpi" style="background:rgba(247,243,233,.08)"><span class="kpi-l" style="color:#C6CFBF">Просрочено</span><span class="kpi-v" style="color:#F7F3E9;font-size:22px">${rub(debtLeft())}</span></div></div>
    ${parentPaid?`<p class="tiny" style="color:#D2B888;margin-top:10px">В том числе оплата семьи Соколовых — ${rub(parentPaid)}.</p>`:''}</section>`;
  const deb=`<section class="card"><div class="ch"><h3>Задолженности</h3><button class="lnk" data-a="remindAll">Напомнить всем${ic('send')}</button></div><div class="list">${DEBT.map(d=>`<div class="li"><span class="ib ${d.days>30?'wine':d.days>14?'gold':''}">${ic('wallet')}</span><span class="li-b"><span class="li-t">${d.f} · ${rub(d.sum)}</span><span class="li-s">${d.k} · ${d.days} ${plural(d.days,'день','дня','дней')}${d.n?' · '+d.n:''}</span></span>${S.reminded[d.id]?`<span class="tag green">${ic('check')}${S.reminded[d.id]}</span>`:`<button class="btn xs sec" data-a="remind" data-v="${d.id}">Напомнить</button>`}</div>`).join('')}</div></section>`;
  const age=[['1–15 дней',199500],['16–30 дней',42500],['более 30 дней',170000]];
  const ag=`<section class="card paper"><div class="ch"><h3>Срок просрочки</h3></div>${age.map((x,i)=>hbar(x[0],x[1],199500,{right:rub(x[1]),cls:i===2?'wine':i===1?'gold':''})).join('')}
    <div class="ch" style="margin:18px 0 10px"><h3>Способы оплаты</h3></div><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">${donut([[.61,'#203E2B'],[.24,'#9F825A'],[.15,'#B9C7B4']],110)}<div class="legend" style="flex-direction:column;gap:6px;margin:0"><span><i style="background:#203E2B"></i>СБП — 61%</span><span><i style="background:#9F825A"></i>Банковская карта — 24%</span><span><i style="background:#B9C7B4"></i>Счёт от юрлица — 15%</span></div></div></section>`;
  const money=`<section class="card"><div class="ch"><h3>Сбор оплат по месяцам</h3><span class="k">% от начисленного</span></div><div class="vb">${[['Сен',98.9],['Окт',97.4],['Ноя',95.6]].map((x,i)=>`<div class="vb-c"><span class="vb-v">${fx(x[1],1)}</span><div class="vb-b ${i===2?'gold':''}" style="height:${(x[1]-80)*5}%"></div><span class="vb-l">${x[0]}</span></div>`).join('')}</div><p class="tiny" style="margin-top:8px">Ноябрь — до 25-го числа; шкала от 80%.</p></section>`;
  return `<div class="mas">${top}${deb}${money}${ag}</div>`;
};
A.remind=v=>{ S.reminded[v]=`сегодня ${clockNow()}`; const d=DEBT.find(x=>x.id===v); toast(`${d.f}: напоминание отправлено в приложение и по СМС`,'send'); refresh(); };
A.remindAll=()=>{ let n=0; DEBT.forEach(d=>{ if(!S.reminded[d.id]){ S.reminded[d.id]=`сегодня ${clockNow()}`; n++; } }); toast(n?`Напоминания отправлены: ${n} ${plural(n,'семья','семьи','семей')}`:'Все семьи уже получили напоминание','send'); refresh(); };

/* dining */
SUB['admin:dining']='Порции — по заказам родителей, замены — по медицинским профилям.';
V['admin:dining']=()=>{
  const lt=lunchTomorrow(), tm=nextSchool(TODAY), seg=[['Детский сад',49],['1–4 классы',98],['5–9 классы',119-(298-lt.lunch)],['10–11 классы',32]];
  const top=`<section class="card dark"><div class="ch"><h3>Завтра · ${fdw(tm)}</h3><span class="k">порций</span></div><div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[['Завтрак',286],['Обед',lt.lunch],['Полдник',214]].map(x=>`<div class="kpi" style="background:rgba(247,243,233,.08);padding:12px"><span class="kpi-l" style="color:#C6CFBF">${x[0]}</span><span class="kpi-v" style="color:#F7F3E9;font-size:26px">${x[1]}</span></div>`).join('')}</div>
    <p style="color:#C6CFBF;margin-top:12px">Отказов от обеда: ${lt.off} · перерасчёт семьям ${rub(lt.off*LUNCH_PRICE)}</p>
    ${S.kitchenSent?`<div class="note green" style="margin-top:14px">${ic('check')}<span>Заявка отправлена на кухню в ${S.kitchenSent}. Шеф-повар подтвердил.</span></div>`:`<button class="btn light block" style="margin-top:14px" data-a="kitchen">${ic('send')}Отправить заявку на кухню</button>`}</section>`;
  const sg=`<section class="card"><div class="ch"><h3>Обеды по возрастам</h3><span class="k">${lt.lunch}</span></div>${seg.map(x=>hbar(x[0],x[1],120)).join('')}</section>`;
  const al=`<section class="card paper"><div class="ch"><h3>Особые профили</h3><span class="k">замены</span></div>${[['Без лактозы',9],['Вегетарианское',7],['Без глютена',6],['Без орехов',4]].map(x=>hbar(x[0],x[1],9,{cls:'gold'})).join('')}
    <div class="note wine" style="margin-top:12px">${ic('alert')}<span>Полдник завтра — брауни с фундуком. Кухня готовит 4 порции без орехов (в т. ч. Соколова Алиса, 5А).</span></div></section>`;
  const wk=[['Пн',301],['Вт',296],['Ср',299],['Чт',lt.lunch],['Пт',284]];
  const ch=`<section class="card"><div class="ch"><h3>Обеды за неделю</h3><span class="k">факт · план · прогноз</span></div><div class="vb">${wk.map((x,i)=>`<div class="vb-c"><span class="vb-v">${x[1]}</span><div class="vb-b ${i===3?'gold':i===4?'hatch':''}" style="height:${(x[1]-250)*1.6}%"></div><span class="vb-l">${x[0]}</span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--green)"></i>факт</span><span><i style="background:var(--gold)"></i>заявка на завтра</span><span><i style="background:#C9D3C3"></i>прогноз</span></div></section>`;
  return `<div class="mas">${top}${ch}${sg}${al}</div>`;
};
A.kitchen=()=>{ S.kitchenSent=clockNow(); toast('Заявка на завтра отправлена на кухню','food'); refresh(); };

/* NPS */
SUB['admin:nps']='Опрос раз в четверть: порекомендуете ли вы гимназию друзьям?';
V['admin:nps']=()=>{
  const g=`<section class="card"><div class="ch"><h3>NPS · IV квартал</h3><span class="k">${NPS.resp} из ${NPS.fam} семей</span></div>${gauge(NPS.score)}
    <div style="display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:14px"><i style="width:${NPS.pro}%;background:#203E2B"></i><i style="width:${NPS.pas}%;background:#C9C3B0"></i><i style="width:${NPS.det}%;background:#6F293E"></i></div>
    <div class="legend"><span><i style="background:#203E2B"></i>Промоутеры ${NPS.pro}%</span><span><i style="background:#C9C3B0"></i>Нейтральные ${NPS.pas}%</span><span><i style="background:#6F293E"></i>Критики ${NPS.det}%</span></div>
    <button class="btn sm ${S.survey?'sec':''}" style="margin-top:14px" data-a="survey" ${S.survey?'disabled':''}>${S.survey?ic('check')+'Опрос запущен':ic('send')+'Запустить опрос I квартала'}</button></section>`;
  const tr=`<section class="card dark"><div class="ch"><h3>Динамика за год</h3><span class="k">2026</span></div><div class="vb">${NPS.trend.map((x,i)=>`<div class="vb-c"><span class="vb-v" style="color:#F7F3E9">${x[1]}</span><div class="vb-b" style="height:${x[1]}%;background:${i===3?'#D2B888':'rgba(247,243,233,.3)'}"></div><span class="vb-l" style="color:#BFC9BA">${x[0]}</span></div>`).join('')}</div></section>`;
  const seg=`<section class="card"><div class="ch"><h3>По ступеням</h3></div>${NPS.seg.map(x=>hbar(x[0],x[1],100,{cls:x[1]<70?'gold':''})).join('')}</section>`;
  const th=`<section class="card paper"><div class="ch"><h3>О чём пишут</h3><span class="k">упоминаний</span></div><div class="lbl" style="margin-bottom:6px">Нравится</div>${NPS.plus.map(x=>hbar(x[0],x[1],46)).join('')}<div class="lbl" style="margin:14px 0 6px">Мешает</div>${NPS.minus.map(x=>hbar(x[0],x[1],46,{cls:'wine'})).join('')}
    <div class="list" style="margin-top:12px">${NPS.quotes.map(q=>`<div class="li" style="align-items:flex-start"><span class="g ${q[2]>=9?'g5':q[2]>=7?'g3':'g2'} sm" style="width:30px">${q[2]}</span><span class="li-b"><span class="li-t" style="font-weight:600">${q[0]}</span><span class="li-s">${q[1]}</span></span></div>`).join('')}</div></section>`;
  return `<div class="mas">${g}${th}${tr}${seg}</div>`;
};
A.survey=()=>{ S.survey=true; toast(`Опрос отправлен ${NPS.fam} семьям — уведомление и письмо`,'send'); refresh(); };

/* clubs load */
SUB['admin:clubs']='Заполненность групп и листы ожидания.';
V['admin:clubs']=()=>{
  const cl=clubLoad(), list=S.clubs.slice().sort((a,b)=>b.cnt/b.cap-a.cnt/a.cap);
  const top=`<section class="card dark"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">${donut([[cl.p,'#C8AC7E']],110,'rgba(247,243,233,.16)')}<div><div class="counter">${Math.round(cl.p*100)}%</div><p style="color:#C6CFBF;margin-top:4px">${cl.c} из ${cl.cap} мест занято · в листах ожидания ${cl.w}</p></div></div></section>`;
  const bars=`<section class="card"><div class="ch"><h3>Загрузка групп</h3><span class="k">записано / мест</span></div>${list.map(c=>hbar(c.n,c.cnt,c.cap,{right:`${c.cnt}/${c.cap}${c.wait?` <span class="tag wine" style="height:24px;padding:0 6px">+${c.wait}</span>`:''}`,cls:c.cnt>=c.cap?'wine':c.cnt/c.cap>0.85?'gold':''})).join('')}<div class="legend"><span><i style="background:var(--green)"></i>есть места</span><span><i style="background:var(--gold)"></i>более 85%</span><span><i style="background:var(--burg)"></i>группа заполнена</span></div></section>`;
  const full=S.clubs.filter(c=>c.cnt>=c.cap);
  const act=`<section class="card paper"><div class="ch"><h3>Решения</h3></div>${full.length?`<div class="list">${full.map(c=>`<div class="li"><span class="ib wine">${ic('users')}</span><span class="li-b"><span class="li-t">${c.n}</span><span class="li-s">${c.when} · ${c.wait?`ожидают ${c.wait}`:'листа ожидания нет'}</span></span><button class="btn xs" data-a="extraGroup" data-v="${c.id}">Доп. группа</button></div>`).join('')}</div>`:'<p class="muted">Заполненных групп нет.</p>'}
    <p class="tiny" style="margin-top:12px">Доп. группа открывает ещё ${'10'} мест; семьи из листа ожидания получают приглашение автоматически.</p></section>`;
  return `<div class="mas">${top}${act}${bars}</div>`;
};
A.extraGroup=v=>{ const c=S.clubs.find(x=>x.id===v); const moved=Math.min(c.wait,10); c.cap+=10; c.cnt+=moved; c.wait-=moved; if(S.waitl[v]){ delete S.waitl[v]; S.my[v]=true; } toast(`«${c.n}»: открыта доп. группа, приглашены ${moved} ${plural(moved,'семья','семьи','семей')} из листа ожидания`,'users'); refresh(); };

/* @@ADMIN@@ */

/* ---------- boot ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const f=A[el.dataset.a]; if(!f) return;
  e.preventDefault(); f(el.dataset.v, el, e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='msgIn'){ e.preventDefault(); A.send(); }
});
document.addEventListener('change',e=>{ const a=e.target&&e.target.dataset&&e.target.dataset.ch; if(a&&A[a]) A[a](e.target.value,e.target); });
document.addEventListener('input',e=>{ const t=e.target, ds=t&&t.dataset; if(!ds) return; if(ds.bind) S[ds.bind]=t.value;
  if(ds.in==='authPhone'||ds.in==='phoneFmt'){ const f=fmtPhone(t.value); if(f!==t.value&&!(e.inputType||'').startsWith('delete')) t.value=f; if(ds.in==='authPhone'){ AUTH.typed=t.value; if(AUTH.err){ AUTH.err=''; const er=document.querySelector('.auth-err'); if(er) er.remove(); } } }
  if(ds.in==='authCode'){ const d=t.value.replace(/\D/g,'').slice(0,4); if(d!==t.value) t.value=d; if(AUTH.err){ AUTH.err=''; const er=document.querySelector('.auth-err'); if(er) er.remove(); } if(d.length===4) A.authCode(); } });
document.addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',onNav);
window.addEventListener('popstate',onNav);
let rw=window.innerWidth; window.addEventListener('resize',()=>{ if((rw<1024)!==(window.innerWidth<1024)){ rw=window.innerWidth; refresh(); } });
try{ document.documentElement.lang='ru'; }catch(e){}
readURL(); render(); setURL(false);
window.DAR={S,go,render};
})();
</script>
